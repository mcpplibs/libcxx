name: CI

# What this workflow asserts.
#
# A C++ standard library is configured for one C library and compiled against
# that library's headers. The claim here is that a program above this package
# imports `std`, reaches the two inline paths that failed at link on the iOS
# rows under the payload's headers over the SDK's libc++, links with no
# reference to another libc++, and runs where the runner can run it. Every row
# `[package] platforms` claims is a gate: Linux over glibc (the combination the
# engine change was first measured on, a prebuilt C library under a graph C++
# runtime), macOS natively, and the three iOS rows. Windows is not claimed and
# is measured by a probe job on request, so that a row this package does not
# serve cannot read as green beside the gates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mcpp_ref:
        description: "Branch of mcpp-community/mcpp to build and test against (empty = the released pin)"
        required: false
        default: ""

env:
  MCPP_SOURCE_REF: ${{ github.event.inputs.mcpp_ref || vars.MCPP_SOURCE_REF }}
  MCPP_VERSION: 2026.9.13.2
  XLINGS_VERSION: v2026.9.5.1
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  linux:
    name: a program imports std over this package (linux, glibc, ${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['llvm@22.1.8']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings and mcpp
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install mcpp
        run: bash tools/install-mcpp.sh

      - name: Select the toolchain
        run: |
          spec='${{ matrix.toolchain }}'
          mcpp toolchain install "${spec%@*}" "${spec#*@}"
          mcpp toolchain default "$spec"

      # The report names the C++ layer as this package's, and the C library
      # as the payload's: the combination this package exists for.
      - name: The program builds, the report names both layers, the link is self-contained
        run: |
          set -euo pipefail
          cd examples/import-std
          mcpp build 2>&1 | tee build.log
          grep -E 'c\+\+-abi +libc\+\+ +\(libcxx@22\.1\.8\.2, graph\)' build.log \
            || { echo "::error::the report does not name llvm.libcxx as the C++ layer"; exit 1; }
          # The report prints a layer only when a package answers for it; the
          # C library is the payload's here and is read from the target line.
          grep -q 'Target x86_64-unknown-linux-gnu' build.log \
            || { echo "::error::the target line is not the glibc row"; exit 1; }
          bin=$(ls -td target/*/*/bin/libcxx-import-std | head -1)
          if ldd "$bin" | grep -q 'libc++'; then
            echo "::error::the artefact still links a libc++ shared object"; ldd "$bin"; exit 1
          fi
          echo "ok: no libc++ shared object in the closure"

      - name: The program runs and prints what the two paths compute
        run: |
          set -euo pipefail
          cd examples/import-std
          out=$(mcpp run 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | tail -3
          grep -qx '1-2-3' <<<"$out" || { echo "::error::expected the line 1-2-3"; exit 1; }

  apple:
    name: a program imports std over this package (${{ matrix.row }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The native row: the payload has macOS archives of its own, and
          # this package replaces them the same way it replaces the SDK's
          # libc++ on iOS. `run` is the host's.
          - { row: aarch64-macos,   platform: "",  runs: host }
          # The simulator that runs on this runner's architecture, through
          # `simctl-run` from `xim:apple-simulator-tools`.
          - { row: aarch64-ios-sim, platform: "7", runs: simulator }
          # The simulator for the other architecture: the artefact is the
          # claim, since a simulator runs the host's architecture only.
          - { row: x86_64-ios-sim,  platform: "7", runs: none }
          # The device row: the artefact is the claim, since running it
          # needs a signature the developer owns.
          - { row: aarch64-ios,     platform: "2", runs: none }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings and mcpp
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
            | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: Install mcpp
        run: bash tools/install-mcpp.sh

      - name: The program builds and both the report and the load commands name no other libc++
        run: |
          set -euo pipefail
          cd examples/import-std
          target='${{ matrix.row }}'
          if [ "$target" = "aarch64-macos" ]; then
            mcpp build 2>&1 | tee build.log
          else
            mcpp build --target "$target" 2>&1 | tee build.log
          fi
          grep -E 'c\+\+-abi +libc\+\+ +\(libcxx@22\.1\.8\.2, graph\)' build.log \
            || { echo "::error::the report does not name llvm.libcxx as the C++ layer"; exit 1; }
          bin=$(ls -td target/*/*/bin/libcxx-import-std | head -1)
          file "$bin"
          otool -L "$bin"
          if otool -L "$bin" | grep -q 'libc++'; then
            echo "::error::the artefact links a libc++ dylib"; exit 1
          fi
          echo "ok: no libc++ dylib in the load commands"
          if [ -n '${{ matrix.platform }}' ]; then
            # The platform in LC_BUILD_VERSION is what tells an iOS artefact
            # from a macOS one; a build that succeeds cannot.
            got=$(otool -l "$bin" | awk '/cmd LC_BUILD_VERSION/{f=1} f && $1=="platform"{print $2; exit}')
            [ "$got" = '${{ matrix.platform }}' ] \
              || { echo "::error::LC_BUILD_VERSION platform is '$got', expected ${{ matrix.platform }}"; exit 1; }
            echo "ok: LC_BUILD_VERSION platform ${{ matrix.platform }}"
          fi

      - name: The program runs and prints what the two paths compute
        if: matrix.runs != 'none'
        run: |
          set -euo pipefail
          cd examples/import-std
          if [ '${{ matrix.runs }}' = host ]; then
            out=$(mcpp run 2>&1) || { echo "$out"; exit 1; }
          else
            out=$(mcpp run --target '${{ matrix.row }}' 2>&1) || { echo "$out"; exit 1; }
          fi
          echo "$out" | tail -3
          grep -qx '1-2-3' <<<"$out" || { echo "::error::expected the line 1-2-3"; exit 1; }

  # THE ROW THIS PACKAGE DOES NOT CLAIM, MEASURED ON REQUEST. libc++ over the
  # MSVC runtime takes a configuration this package does not carry; this job
  # records what actually happens there, every step continuing on error, and
  # it does not run on push so that it cannot read as a gate.
  windows-probe:
    name: "probe, not a gate: what happens on windows x86_64"
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The released Windows archive, the way mcpp-plugins' own Windows job
      # takes it: the quick installer is a POSIX script and the runner's bash
      # cannot put its shim on PATH.
      - name: Fetch the released mcpp
        continue-on-error: true
        run: |
          set -e
          curl -L -fsS --retry 3 --retry-all-errors -o mcpp.zip \
            "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/mcpp-${MCPP_VERSION}-windows-x86_64.zip"
          unzip -q mcpp.zip
          echo "MCPP=$PWD/mcpp-${MCPP_VERSION}-windows-x86_64/bin/mcpp.exe" >> "$GITHUB_ENV"
          H="$HOME/.mcpp"; command -v cygpath >/dev/null && H=$(cygpath -m "$H")
          echo "MCPP_HOME=$H" >> "$GITHUB_ENV"
      - name: The program over this package, on the host's default toolchain
        continue-on-error: true
        run: |
          cd examples/import-std
          "$MCPP" --version
          "$MCPP" build 2>&1 | tail -40
